<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AULA S350 PRO Control</title>
  <meta name="description" content="Configure the AULA S350 PRO gaming mouse from your browser: buttons, DPI, lighting, macros and performance.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='2' width='18' height='28' rx='9' fill='%235b6cff'/%3E%3Crect x='15' y='6' width='2' height='7' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="2" width="18" height="28" rx="9" /><rect class="wheel" x="15" y="6" width="2" height="7" rx="1" /></svg>
      <div>
        <div class="brand-name">AULA S350 PRO</div>
        <div class="brand-sub" id="device-sub">Not connected</div>
      </div>
    </div>
    <div class="profiles" id="profiles" hidden></div>
    <div class="top-actions">
      <span class="save-state" id="save-state"></span>
      <button class="btn ghost" id="btn-disconnect" hidden>Disconnect</button>
    </div>
  </header>

  <main id="app"></main>

  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <div class="modal-host" id="modal"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
